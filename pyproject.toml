[project]
name = "modbus-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maintainer", email = "noreply@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymodbus>=3.15,<4.0",
]

[project.scripts]
modbus-simulator = "modbus_simulator:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
